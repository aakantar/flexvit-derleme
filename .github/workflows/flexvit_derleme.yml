# FlexViT (SECDA-TFLite) - PYNQ-Z2 icin derleme, surum 3: DMA adresi secilebilir + DMA baslatma/bitiste bellek bariyeri (dsb + L2 sync)
# GitHub'da: Actions sekmesi -> "FlexViT derleme" -> "Run workflow"
# Sonuc: calisma sayfasinin altinda "Artifacts" bolumunde
#   flexvit-pynq-z2      -> karta atilacak dosyalar
#   derleme-gunlugu      -> hata olursa bana gonderilecek kayit

name: FlexViT derleme (teshis)

on:
  workflow_dispatch:

jobs:
  derle:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      TF_PYTHON_VERSION: "3.9"
      BAZEL_ROOT: /mnt/bazel
    steps:
      - name: 1 - Disk alani ac
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p $BAZEL_ROOT && sudo chown -R $USER $BAZEL_ROOT
          df -h / /mnt

      - name: 2 - Araclari kur
        run: |
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-armhf libz-dev jq rsync unzip
          wget -q https://github.com/bazelbuild/bazel/releases/download/6.1.0/bazel-6.1.0-linux-x86_64 -O bazel6
          chmod +x bazel6 && sudo mv bazel6 /usr/local/bin/bazel6
          bazel6 --version

      - name: 3 - Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 4 - SECDA-TFLite ve FlexViT'i indir
        run: |
          pip install numpy
          git clone https://github.com/gicLAB/SECDA-TFLite.git
          cd SECDA-TFLite
          git submodule update --init --depth 1
          cd tensorflow
          git fetch --depth 1 origin secda-tflite-v2
          git checkout -B secda-tflite-v2 FETCH_HEAD
          git log -1 --format="tensorflow commit: %H"
          cd ..
          git log -1 --format="SECDA-TFLite commit: %H"
          git clone https://github.com/gicLAB/FlexViT.git FlexViT
          git -C FlexViT log -1 --format="FlexViT commit: %H"

      - name: 5 - Kurulum betikleri (setup.sh + FlexViT entegrasyonu)
        run: |
          cd SECDA-TFLite/scripts
          bash ./setup.sh
          cd ../FlexViT
          chmod +x flexvit_integration.sh patch_vscode.sh
          ./flexvit_integration.sh
          ls -la ../tensorflow/tensorflow/lite/delegates/utils/secda_delegates/
          ls ../tensorflow/tensorflow/lite/delegates/utils/secda_delegates/vit_delegate/v9/

      - name: 5b - DMA tampon adreslerini calisma aninda secilebilir yap
        run: |
          cat > yama_dma_adres.py <<'PYEOF'
          # FlexViT DMA tampon adreslerini calisma aninda secilebilir yapar (FLEXVIT_DMA_BASE).
          # Ortam degiskeni yoksa orijinal adresler aynen kullanilir.
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          if 'fv_dma_addr' in s:
              print('zaten yamali:', p); sys.exit(0)
          helper = '''#include <cstdlib>
          static inline unsigned int fv_dma_addr(int i, int out) {
            const char *s = getenv("FLEXVIT_DMA_BASE");
            if (s) return (unsigned int)strtoul(s, 0, 0) + i * 0x800000u + (out ? 0x400000u : 0u);
            return 0x16000000u + i * 0x2000000u + (out ? 0x800000u : 0u);
          }
          '''
          n = 0
          for i in range(4):
              s, k = re.subn(r'(?m)^#define dma_in%d 0x[0-9a-fA-F]+' % i, '#define dma_in%d fv_dma_addr(%d, 0)' % (i, i), s); n += k
              s, k = re.subn(r'(?m)^#define dma_out%d 0x[0-9a-fA-F]+' % i, '#define dma_out%d fv_dma_addr(%d, 1)' % (i, i), s); n += k
          s, k = re.subn(r'#define DMA_IN_BUF_SIZE_4 \(dma_out1 - dma_in0\)', '#define DMA_IN_BUF_SIZE_4 0x2800000', s); n += k
          assert n == 9, "beklenen 9 degisiklik, bulunan %d" % n
          s = s.replace('#define ACC_CONFIG_H\n', '#define ACC_CONFIG_H\n' + helper, 1)
          open(p, 'w').write(s)
          print("yama uygulandi:", p)
          PYEOF
          FILES=$(find SECDA-TFLite -path "*vit_delegate/v9/accelerator/acc_config.sc.h" -type f)
          echo "Bulunan dosyalar: $FILES"
          test -n "$FILES"
          for f in $FILES; do python3 yama_dma_adres.py "$f"; done
          grep -n "fv_dma_addr\|DMA_IN_BUF_SIZE_4" $FILES

      - name: 5c - secda_tools DMA API'sine bariyer + gecikme secenegi ekle
        run: |
          git clone -q --depth 1 --branch 0.2.2 https://github.com/judeharis/secda_tools.git secda_tools_yamali
          cat > yama_bariyer.py <<'PYEOF'
          # FlexViT/SECDA DMA API'sine bellek bariyeri ekler (axi_api_v4.tpp).
          # DMA baslatilmadan once: dsb + L2 (PL310) cache sync + dsb   -> islemcinin yazdiklari DDR'ye ulasmis olur
          # DMA bittikten sonra: dsb                                      -> cikti okumalari DMA'dan sonra yapilir
          # FLEXVIT_DELAY_US=N her DMA baslatmadan once N mikrosaniye bekler (zamanlama testi).
          # FLEXVIT_NO_L2SYNC=1 ortam degiskeni L2 sync'i kapatir (yalniz dsb kalir) -> karsilastirma icin.
          import sys
          p = sys.argv[1]
          s = open(p).read()
          if "fv_barrier" in s:
              print("zaten yamali:", p); sys.exit(0)
          helper = r'''
          // ---- FlexViT tez yamasi: bellek bariyerleri ----
          #include <fcntl.h>
          #include <sys/mman.h>
          #include <unistd.h>
          #include <cstdlib>
          static inline void fv_dsb() {
          #if defined(__arm__)
            __asm__ __volatile__("dsb sy" ::: "memory");
          #else
            __sync_synchronize();
          #endif
          }
          static volatile unsigned int *fv_l2c = nullptr;
          static int fv_l2c_init = 0;
          static inline void fv_l2_sync() {
          #if defined(__arm__)
            if (!fv_l2c_init) {
              fv_l2c_init = 1;
              if (!getenv("FLEXVIT_NO_L2SYNC")) {
                int fd = open("/dev/mem", O_RDWR | O_SYNC);
                if (fd >= 0) {
                  void *pp = mmap(NULL, 0x1000, PROT_READ | PROT_WRITE, MAP_SHARED, fd, 0xF8F02000);
                  close(fd);
                  if (pp != MAP_FAILED) fv_l2c = (volatile unsigned int *)pp;
                }
              }
            }
            if (fv_l2c) {
              fv_l2c[0x730 / 4] = 0;
              while (fv_l2c[0x730 / 4] & 1) {
              }
            }
          #endif
          }
          static inline void fv_barrier() { fv_dsb(); fv_l2_sync(); fv_dsb(); }
          static int fv_delay_us = -1;
          static inline void fv_delay() {
            if (fv_delay_us < 0) { const char *e = getenv("FLEXVIT_DELAY_US"); fv_delay_us = e ? atoi(e) : 0; }
            if (fv_delay_us > 0) usleep(fv_delay_us);
          }
          // ---- yama sonu ----
          '''
          n = 0
          old_w = "void *base_addr = (void *)dma_addr;\n  *((volatile unsigned int *)"
          new_w = "void *base_addr = (void *)dma_addr;\n  if (offset == MM2S_LENGTH || offset == S2MM_LENGTH) { fv_barrier(); fv_delay(); }\n  *((volatile unsigned int *)"
          assert s.count(old_w) == 1, "writeMappedReg bulunamadi"
          s = s.replace(old_w, new_w); n += 1
          for st in ("mm2s_status", "s2mm_status"):
              old = "    %s = readMappedReg(%s_STATUS_REGISTER);\n  }\n" % (st, st[:4].upper())
              assert s.count(old) == 1, "sync dongusu bulunamadi: " + st
              s = s.replace(old, old + "  fv_dsb();\n"); n += 1
          s = helper + s
          open(p, "w").write(s)
          print("yama uygulandi (%d degisiklik):" % n, p)
          PYEOF
          python3 yama_bariyer.py secda_tools_yamali/secda_tools/axi_support/v5/axi_api_v5.tpp
          grep -n "fv_barrier();\|fv_dsb();" secda_tools_yamali/secda_tools/axi_support/v5/axi_api_v5.tpp

      - name: 6 - TensorFlow configure (otomatik cevaplar)
        continue-on-error: true
        run: |
          cd SECDA-TFLite/tensorflow
          export PYTHON_BIN_PATH=$(which python3)
          export PYTHON_LIB_PATH=$(python3 -c "import site; print(site.getsitepackages()[0])")
          export TF_NEED_ROCM=0 TF_NEED_CUDA=0 TF_NEED_CLANG=0 TF_SET_ANDROID_WORKSPACE=0
          export CC_OPT_FLAGS="-Wno-sign-compare"
          yes "" | ./configure || true
          cat .tf_configure.bazelrc || true

      - name: 7 - Derle (benchmark_model + inference_diff, FlexViT temsilcisi ile)
        run: |
          cd SECDA-TFLite/tensorflow
          FLAGS="--copt=-DSECDA_LOGGING_DISABLED --cxxopt=-march=armv7-a --cxxopt=-mfpu=neon --cxxopt=-funsafe-math-optimizations --cxxopt=-ftree-vectorize --copt=-DACC_PROFILE --define tflite_with_xnnpack=false --copt=-DTFLITE_ENABLE_XNNPACK=OFF --copt=-DTFLITE_WITHOUT_XNNPACK --copt=-DACC_NEON --@secda_tools//:config=fpga --override_module=secda_tools=$GITHUB_WORKSPACE/secda_tools_yamali"
          T=//tensorflow/lite/delegates/utils/secda_delegates/vit_delegate/v9
          set -o pipefail
          bazel6 --output_user_root=$BAZEL_ROOT build --config=elinux_armhf -c opt --jobs=4 \
            $T:benchmark_model_plus_vit_delegate \
            $T:inference_diff_plus_vit_delegate \
            $FLAGS 2>&1 | tee ../../derleme.log

      - name: 8 - Karta atilacak dosyalari topla
        run: |
          mkdir -p cikti/bin cikti/models cikti/bitstreams
          B=SECDA-TFLite/tensorflow/bazel-out/armhf-opt/bin/tensorflow/lite/delegates/utils/secda_delegates/vit_delegate/v9
          cp $B/benchmark_model_plus_vit_delegate $B/inference_diff_plus_vit_delegate cikti/bin/
          cp SECDA-TFLite/FlexViT/src/data/models/deit_tiny_patch16_224.tflite cikti/models/
          cp SECDA-TFLite/FlexViT/src/data/models/vit_tiny_patch16_224.tflite cikti/models/
          cp SECDA-TFLite/FlexViT/src/hardware_automation/generated/VIT_9_0/VIT_9_0.* cikti/bitstreams/
          cp SECDA-TFLite/FlexViT/src/hardware_automation/generated/CPU/CPU_1_0.* cikti/bitstreams/
          cp SECDA-TFLite/scripts/load_bitstream.py cikti/
          file cikti/bin/* | tee cikti/dosya_bilgisi.txt
          ls -laR cikti

      - name: 9 - Sonucu yukle (karta atilacak dosyalar)
        uses: actions/upload-artifact@v4
        with:
          name: flexvit-pynq-z2-v4
          path: cikti

      - name: 10 - Gunlugu yukle (hata olsa da)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: derleme-gunlugu
          path: derleme.log
          if-no-files-found: ignore
